<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="wpt-version" content="V6.0.0">
    <meta name="theme-color" content="#102832">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <title>WPT Monitor - 报警</title>
    <script src="js/auth-guard.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-page="alerts" class="flex h-screen overflow-hidden">

    <!-- PC Sidebar -->
    <aside class="w-64 flex-col z-50 flex-shrink-0 relative h-screen hidden lg:flex">
        <div class="h-20 border-b flex items-center justify-center">
            <h1 class="text-xl font-extrabold tracking-tight">WPT Monitor</h1>
        </div>
        <nav class="flex-1 py-6 space-y-2 px-4 overflow-y-auto custom-scrollbar">
            <a class="nav-item flex items-center px-4 py-3 rounded-xl font-bold" href="/">
                <i class="fas fa-home w-6 text-center mr-3"></i> 首页
            </a>
            <a class="nav-item flex items-center px-4 py-3 rounded-xl font-bold" href="/monitoring">
                <i class="fas fa-chart-bar w-6 text-center mr-3"></i> 监测
            </a>
            <a class="nav-item flex items-center px-4 py-3 rounded-xl font-bold" href="/control">
                <i class="fas fa-sliders-h w-6 text-center mr-3"></i> 控制
            </a>
            <a class="nav-item flex items-center px-4 py-3 rounded-xl font-bold" href="/history">
                <i class="fas fa-chart-line w-6 text-center mr-3"></i> 历史
            </a>
            <a class="nav-item flex items-center px-4 py-3 rounded-xl font-bold" href="/alerts">
                <i class="fas fa-bell w-6 text-center mr-3"></i> 报警
            </a>
            <a class="nav-item flex items-center px-4 py-3 rounded-xl font-bold" href="/settings">
                <i class="fas fa-cog w-6 text-center mr-3"></i> 设置
            </a>
        </nav>
        <div class="p-4 border-t absolute bottom-0 w-full">
            <div class="text-xs text-center font-medium">WPT Monitor V6.0.0</div>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-screen overflow-y-auto w-full relative custom-scrollbar">

        <!-- Header -->
        <header class="h-12 lg:h-16 px-3 lg:px-8 flex items-center justify-between border-b z-10 relative flex-shrink-0">
            <div class="flex items-center space-x-2 lg:space-x-4">
                <h1 class="text-base lg:text-xl font-bold tracking-tight">实时告警中心</h1>
            </div>
            <div class="flex items-center space-x-2 lg:space-x-4">
                <span id="alertPollStatus" class="summary-chip" aria-live="polite">--</span>
                <button id="alertsRefreshBtn" class="icon-btn" type="button" aria-label="刷新报警">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <div class="user-badge">
                    <i class="fas fa-user-shield text-sm"></i>
                </div>
            </div>
        </header>

        <main class="alerts-main px-4 lg:px-10 py-5 space-y-6">
            <section class="alerts-overview">
                <div>
                    <h2>告警总览</h2>
                    <p id="alertsSummary" class="alerts-summary-text" aria-live="polite">无活动报警</p>
                </div>
                <div class="alerts-counts">
                    <div class="alert-count alert-count--active"><span>活动</span><strong id="activeAlertCount">0</strong></div>
                    <div class="alert-count alert-count--unack"><span>未确认</span><strong id="unackAlertCount">0</strong></div>
                    <div class="alert-count alert-count--resolved"><span>已恢复</span><strong id="resolvedAlertCount">0</strong></div>
                </div>
            </section>

            <section class="alert-toolbar">
                <div class="alert-filters" role="group" aria-label="报警筛选">
                    <button type="button" class="alert-filter" data-alert-filter="all" aria-pressed="true">全部</button>
                    <button type="button" class="alert-filter" data-alert-filter="active" aria-pressed="false">活动</button>
                    <button type="button" class="alert-filter" data-alert-filter="unacknowledged" aria-pressed="false">未确认</button>
                    <button type="button" class="alert-filter" data-alert-filter="resolved" aria-pressed="false">已恢复</button>
                </div>
                <div class="alert-toolbar__right">
                    <label>端点
                        <select id="alertDeviceFilter">
                            <option value="all">全部</option>
                            <option value="tx">TX</option>
                            <option value="rx">RX</option>
                        </select>
                    </label>
                    <button type="button" id="acknowledgeAllBtn" class="btn btn-ghost" disabled>全部确认</button>
                    <button type="button" id="clearResolvedBtn" class="btn btn-ghost" disabled>只清已恢复</button>
                </div>
            </section>

            <section class="alert-list-wrap">
                <ul id="alertsList" class="alert-list"></ul>
                <p id="alertsEmpty" class="alerts-empty" hidden>暂无符合条件的报警</p>
            </section>
        </main>
    </div>

    <!-- 清理确认对话框 -->
    <div id="alertClearDialog" class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="alertClearTitle" hidden>
        <div class="confirm-dialog__panel">
            <h3 id="alertClearTitle">确认清理</h3>
            <p id="alertClearMessage">将删除全部已恢复的报警记录，活动报警保留，确认？</p>
            <div class="actions">
                <button type="button" id="alertClearCancel" class="btn btn-ghost">取消</button>
                <button type="button" id="alertClearConfirm" class="btn btn-danger">确认</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/onenet.js"></script>
    <script src="js/ui-common.js"></script>
    <script src="js/alert-engine.js"></script>
    <script src="js/alerts-page.js"></script>
    <script src="js/mobile-nav.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="wpt-version" content="V6.0.0">
    <meta name="theme-color" content="#102832">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <title>WPT Monitor - 历史</title>
    <script src="js/auth-guard.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-page="history" class="flex h-screen overflow-hidden">

    <!-- PC Sidebar -->
    <aside class="w-64 flex-col z-50 flex-shrink-0 relative h-screen hidden lg:flex">
        <div class="h-20 border-b flex items-center justify-center">
            <h1 class="text-xl font-extrabold tracking-tight">WPT Monitor</h1>
        </div>
        <nav class="flex-1 py-6 space-y-2 px-4 overflow-y-auto custom-scrollbar">
            <a class="nav-item flex items-center px-4 py-3 rounded-xl font-bold" href="/">
                <i class="fas fa-home w-6 text-center mr-3"></i> 首页
            </a>
            <a class="nav-item flex items-center px-4 py-3 rounded-xl font-bold" href="/monitoring">
                <i class="fas fa-chart-bar w-6 text-center mr-3"></i> 监测
            </a>
            <a class="nav-item flex items-center px-4 py-3 rounded-xl font-bold" href="/control">
                <i class="fas fa-sliders-h w-6 text-center mr-3"></i> 控制
            </a>
            <a class="nav-item flex items-center px-4 py-3 rounded-xl font-bold" href="/history">
                <i class="fas fa-chart-line w-6 text-center mr-3"></i> 历史
            </a>
            <a class="nav-item flex items-center px-4 py-3 rounded-xl font-bold" href="/alerts">
                <i class="fas fa-bell w-6 text-center mr-3"></i> 报警
            </a>
            <a class="nav-item flex items-center px-4 py-3 rounded-xl font-bold" href="/settings">
                <i class="fas fa-cog w-6 text-center mr-3"></i> 设置
            </a>
        </nav>
        <div class="p-4 border-t absolute bottom-0 w-full">
            <div class="text-xs text-center font-medium">WPT Monitor V6.0.0</div>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-screen overflow-y-auto w-full relative custom-scrollbar">

        <!-- Header -->
        <header class="h-12 lg:h-16 px-3 lg:px-8 flex items-center justify-between border-b z-10 relative flex-shrink-0 history-header">
            <div class="flex items-center space-x-2 lg:space-x-4">
                <h1 class="text-base lg:text-xl font-bold tracking-tight history-title">云端历史</h1>
            </div>
            <div class="flex items-center space-x-2 lg:space-x-4 history-header-actions">
                <span id="historyStatus" class="summary-chip" aria-live="polite">--</span>
                <button id="historyRefreshBtn" class="icon-btn" type="button" aria-label="刷新历史">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button id="historyExportBtn" class="btn btn-ghost" type="button" disabled>导出 CSV</button>
                <div class="user-badge history-user-badge">
                    <i class="fas fa-user-shield text-sm"></i>
                </div>
            </div>
        </header>

        <main class="history-main px-4 lg:px-10 py-5 space-y-6">
            <section class="history-controls">
                <div class="history-control">
                    <label for="historyModeSelect">模式</label>
                    <select id="historyModeSelect">
                        <option value="tx">发射端 TX</option>
                        <option value="rx">接收端 RX</option>
                        <option value="compare">双端比较</option>
                    </select>
                </div>
                <div id="historyMetricSelectors" class="history-metric-selectors">
                    <div id="historyTxSelector" class="history-control">
                        <label for="historyTxMetricSelect">TX 指标</label>
                        <select id="historyTxMetricSelect"></select>
                    </div>
                    <div id="historyRxSelector" class="history-control">
                        <label for="historyRxMetricSelect">RX 指标</label>
                        <select id="historyRxMetricSelect"></select>
                    </div>
                </div>
                <div class="history-control">
                    <label for="historyRangeSelect">范围</label>
                    <select id="historyRangeSelect">
                        <option value="1">最近 1 小时</option>
                        <option value="6">最近 6 小时</option>
                        <option value="24">最近 24 小时</option>
                    </select>
                </div>
            </section>

            <section class="history-panel">
                <h2>趋势图</h2>
                <div id="historyChartWrap" class="history-chart-wrap">
                    <div id="historyEmpty" class="history-empty" hidden>暂无云历史</div>
                    <canvas id="historyChart"></canvas>
                </div>
            </section>

            <section class="history-panel">
                <h2>历史明细</h2>
                <div class="history-table-wrap">
                    <table class="history-table">
                        <thead id="historyTableHead"></thead>
                        <tbody id="historyTableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/onenet.js"></script>
    <script src="js/ui-common.js"></script>
    <script src="js/history-core.js"></script>
    <script src="js/history-page.js"></script>
    <script src="js/mobile-nav.js"></script>
</body>
</html>

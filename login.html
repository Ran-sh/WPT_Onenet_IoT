<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="wpt-version" content="V6.0.0">
    <meta name="theme-color" content="#102832">
    <meta name="description" content="WPT 无线充电系统实时监测与远程控制入口">
    <title>WPT Monitor - 登录</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }
        .bg-gradient-custom {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
        }
    </style>
</head>
<body data-page="login" class="min-h-screen flex bg-gray-50 overflow-hidden">
    
    <!-- Left Side: Banner / Branding -->
    <div class="hidden lg:flex lg:w-1/2 bg-gradient-custom text-white flex-col justify-between p-12 relative overflow-hidden">
        <!-- Background decorative elements -->
        <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none opacity-20">
            <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-white blur-3xl"></div>
            <div class="absolute bottom-[10%] right-[10%] w-[30%] h-[30%] rounded-full bg-blue-300 blur-3xl"></div>
        </div>

        <div class="relative z-10 flex items-center space-x-3">
            <div class="w-12 h-12 bg-white/20 backdrop-blur-md rounded-xl flex items-center justify-center shadow-lg border border-white/30">
                <i class="fas fa-network-wired text-2xl text-white"></i>
            </div>
            <span class="text-2xl font-extrabold tracking-wider">WPT Monitor</span>
        </div>

        <div class="relative z-10 mb-20">
            <div class="inline-flex items-center px-3 py-1 rounded-full bg-cyan-300/10 border border-cyan-200/20 text-cyan-100 text-xs font-bold tracking-widest mb-6">STM32 · ESP8266 · OneNET</div>
            <h1 class="text-5xl font-extrabold leading-tight mb-6">看清输出<br/>安全控制</h1>
            <p class="text-lg text-blue-100 max-w-md leading-relaxed">
                面向 WPT 无线充电装置的专用监控台。集中查看电压、电流、实际频率和设备状态，并按固件边界安全下发控制。
            </p>
        </div>

        <div class="relative z-10 text-sm text-blue-200 font-medium tracking-wide">
            © 2026 Rssss 开源物联网工具
        </div>
    </div>

    <!-- Right Side: Access Info -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-white relative h-screen">
        <div class="w-full max-w-md space-y-8">
            <div class="text-center lg:text-left mb-10">
                <h2 class="text-3xl font-extrabold text-gray-900 mb-2">访问受限</h2>
                <p class="text-gray-500 text-sm">访问边界由 Cloudflare Access 强制执行</p>
            </div>

            <div id="accessInfo" class="rounded-xl border border-blue-100 bg-blue-50/60 px-3.5 py-3 text-xs leading-relaxed text-blue-800">
                <i class="fas fa-shield-halved mr-1"></i>
                本站已停用本地账号密码登录。通过 Cloudflare Access 后可直接进入监控与控制页面；未通过 Access 时，静态页面不会被送达。
            </div>

            <div class="flex flex-col gap-3">
                <a href="/" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-blue-600/30 transition-all transform hover:-translate-y-0.5 text-center">
                    <i class="fas fa-arrow-right-to-bracket mr-2"></i>进入监控主页
                </a>
                <a href="/cdn-cgi/access/logout" class="w-full py-3.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-sm rounded-xl transition-all text-center">
                    <i class="fas fa-sign-out-alt mr-2"></i>退出 Cloudflare Access 会话
                </a>
            </div>

            <!-- Mobile Footer -->
            <div class="lg:hidden text-center text-gray-400 text-xs font-medium tracking-wide mt-12">
                © 2026 Rssss 开源物联网工具
            </div>
        </div>
    </div>

</body>
</html>

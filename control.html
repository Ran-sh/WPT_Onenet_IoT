<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="wpt-version" content="V6.0.0">
    <meta name="theme-color" content="#102832">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <title>WPT Monitor - 设备控制</title>
    <script src="js/auth-guard.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-page="control" class="flex h-screen overflow-hidden" style="padding-bottom:env(safe-area-inset-bottom, 0px)">

    <!-- PC Sidebar -->
    <aside class="w-64 flex-col z-50 flex-shrink-0 relative h-screen hidden lg:flex">
        <div class="h-20 border-b flex items-center justify-center">
            <h1 class="text-xl font-extrabold tracking-tight">WPT Monitor</h1>
        </div>
        <nav class="flex-1 py-6 space-y-2 px-4 overflow-y-auto custom-scrollbar">
            <a class="nav-item flex items-center px-4 py-3 rounded-xl font-bold" href="/">
                <i class="fas fa-home w-6 text-center mr-3"></i> 首页
            </a>
            <a class="nav-item flex items-center px-4 py-3 rounded-xl font-bold" href="/monitoring">
                <i class="fas fa-chart-bar w-6 text-center mr-3"></i> 监测
            </a>
            <a class="nav-item flex items-center px-4 py-3 rounded-xl font-bold" href="/control">
                <i class="fas fa-sliders-h w-6 text-center mr-3"></i> 控制
            </a>
            <a class="nav-item flex items-center px-4 py-3 rounded-xl font-bold" href="/history">
                <i class="fas fa-chart-line w-6 text-center mr-3"></i> 历史
            </a>
            <a class="nav-item flex items-center px-4 py-3 rounded-xl font-bold" href="/alerts">
                <i class="fas fa-bell w-6 text-center mr-3"></i> 报警
            </a>
            <a class="nav-item flex items-center px-4 py-3 rounded-xl font-bold" href="/settings">
                <i class="fas fa-cog w-6 text-center mr-3"></i> 设置
            </a>
        </nav>
        <div class="p-4 border-t absolute bottom-0 w-full">
            <div class="text-xs text-center font-medium">WPT Monitor V6.0.0</div>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-screen overflow-y-auto w-full relative custom-scrollbar">

        <!-- Header -->
        <header class="h-12 lg:h-16 px-3 lg:px-8 flex items-center justify-between border-b z-10 relative flex-shrink-0">
            <div class="flex items-center space-x-2 lg:space-x-4">
                <h1 class="text-base lg:text-xl font-bold tracking-tight">双端远程控制</h1>
            </div>
            <div class="flex items-center space-x-2 lg:space-x-4">
                <span id="controlStatus" class="summary-chip control-status-chip" aria-live="polite">--</span>
                <button id="controlSyncBtn" class="icon-btn" type="button" aria-label="刷新数据">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <div class="user-badge">
                    <i class="fas fa-user-shield text-sm"></i>
                </div>
            </div>
        </header>

        <main class="control-main px-4 lg:px-10 py-5 space-y-6">
            <div class="control-grid">
                <section class="control-panel endpoint-tx">
                    <header class="control-panel__header">
                        <h2>发射端 TX</h2>
                        <span id="txEndpointState" class="status-pill" data-state="pending">等待数据</span>
                    </header>
                    <dl class="control-meta">
                        <div><dt>设备</dt><dd id="txDeviceName">未配置</dd></div>
                        <div><dt>源时间</dt><dd id="txSourceTime">--</dd></div>
                    </dl>
                    <div class="control-values">
                        <div class="control-value"><span>状态</span><strong id="txStateValue">--</strong></div>
                        <div class="control-value"><span>电压</span><strong id="txVoltageValue">--</strong></div>
                        <div class="control-value"><span>电流</span><strong id="txCurrentValue">--</strong></div>
                        <div class="control-value"><span>频率</span><strong id="txFrequencyValue">--</strong></div>
                    </div>
                    <div class="control-actions">
                        <button type="button" id="txOnBtn" class="btn btn-primary" disabled>启动 ON</button>
                        <button type="button" id="txOffBtn" class="btn btn-danger" disabled>停止 OFF</button>
                        <form id="txFrequencyForm" class="control-form">
                            <label for="txFrequencyInput" class="visually-hidden-label">频率 (kHz)</label>
                            <input id="txFrequencyInput" type="text" inputmode="decimal" placeholder="20.0-200.0 kHz">
                            <button type="submit" id="txFrequencyBtn" class="btn btn-ghost" disabled>调频</button>
                        </form>
                    </div>
                    <p id="txGateReason" class="control-gate-reason"></p>
                </section>

                <section class="control-panel endpoint-rx">
                    <header class="control-panel__header">
                        <h2>接收端 RX</h2>
                        <span id="rxEndpointState" class="status-pill" data-state="pending">等待数据</span>
                    </header>
                    <dl class="control-meta">
                        <div><dt>设备</dt><dd id="rxDeviceName">未配置</dd></div>
                        <div><dt>源时间</dt><dd id="rxSourceTime">--</dd></div>
                    </dl>
                    <div class="control-values">
                        <div class="control-value"><span>状态</span><strong id="rxStateValue">--</strong></div>
                        <div class="control-value"><span>BLE</span><strong id="rxBleValue">--</strong></div>
                        <div class="control-value"><span>有效</span><strong id="rxValidValue">--</strong></div>
                        <div class="control-value"><span>故障</span><strong id="rxFaultValue">--</strong></div>
                    </div>
                    <div class="control-actions">
                        <button type="button" id="rxStartBtn" class="btn btn-primary" disabled>启动 START</button>
                        <button type="button" id="rxStopBtn" class="btn btn-danger" disabled>停止 STOP</button>
                        <button type="button" id="rxStatusBtn" class="btn btn-ghost" disabled>查询 STATUS</button>
                        <button type="button" id="rxZeroBtn" class="btn btn-ghost" disabled>清零 ZERO</button>
                        <form id="rxRateForm" class="control-form">
                            <label for="rxRateInput" class="visually-hidden-label">RATE (ms)</label>
                            <input id="rxRateInput" type="text" inputmode="numeric" placeholder="100-5000 ms">
                            <button type="submit" id="rxRateBtn" class="btn btn-ghost" disabled>设置 RATE</button>
                        </form>
                    </div>
                    <p id="rxGateReason" class="control-gate-reason"></p>
                    <div class="control-audit">
                        <span>审计序号 <strong id="rxAuditSequence">--</strong></span>
                        <span>命令 <strong id="rxAuditCommand">--</strong></span>
                        <span>结果 <strong id="rxAuditResult">--</strong></span>
                    </div>
                </section>
            </div>

            <section class="control-logs">
                <header>
                    <h2>最近操作记录</h2>
                    <div class="control-logs__tools">
                        <label>端点
                            <select id="logDeviceFilter">
                                <option value="all">全部</option>
                                <option value="tx">TX</option>
                                <option value="rx">RX</option>
                            </select>
                        </label>
                        <button type="button" id="clearOperationLogsBtn" class="btn btn-ghost">清空记录</button>
                    </div>
                </header>
                <div class="control-logs__table-wrap">
                    <table class="control-logs__table">
                        <thead>
                            <tr>
                                <th>操作时间</th>
                                <th>端点</th>
                                <th>命令</th>
                                <th>下发/设备结果</th>
                                <th>requestId</th>
                                <th>审计结果</th>
                            </tr>
                        </thead>
                        <tbody id="operationLogBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- 可访问确认对话框 -->
    <div id="controlConfirmDialog" class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="controlConfirmTitle" hidden>
        <div class="confirm-dialog__panel">
            <h3 id="controlConfirmTitle">确认操作</h3>
            <p id="controlConfirmMessage"></p>
            <div class="actions">
                <button type="button" id="controlConfirmCancel" class="btn btn-ghost">取消</button>
                <button type="button" id="controlConfirmConfirm" class="btn btn-danger">确认</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/onenet.js"></script>
    <script src="js/ui-common.js"></script>
    <script src="js/control-core.js"></script>
    <script src="js/control-page.js"></script>
    <script src="js/mobile-nav.js"></script>
</body>
</html>
